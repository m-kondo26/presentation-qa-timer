<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7faf9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="発表タイマー" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>発表・質疑カウントダウン</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section id="setupPanel" class="setup-panel">
        <div class="setup-copy">
          <p class="app-label">iPad 発表タイマー</p>
          <h1>発表時間と質疑応答を設定</h1>
          <p>開始後は残り時間を大きく表示します。</p>
        </div>

        <div class="duration-grid" aria-label="時間設定">
          <article class="duration-card">
            <div>
              <span class="duration-label">発表時間</span>
              <strong><span id="presentationValue">7</span>分</strong>
            </div>
            <div class="stepper" role="group" aria-label="発表時間を1分単位で変更">
              <button type="button" class="icon-button" data-adjust="presentation" data-delta="-1" aria-label="発表時間を1分短くする">
                <span aria-hidden="true">−</span>
              </button>
              <input id="presentationInput" type="number" min="1" max="60" step="1" inputmode="numeric" value="7" aria-label="発表時間（分）" />
              <button type="button" class="icon-button" data-adjust="presentation" data-delta="1" aria-label="発表時間を1分長くする">
                <span aria-hidden="true">＋</span>
              </button>
            </div>
          </article>

          <article class="duration-card">
            <div>
              <span class="duration-label">質疑応答</span>
              <strong><span id="qaValue">3</span>分</strong>
            </div>
            <div class="stepper" role="group" aria-label="質疑応答を1分単位で変更">
              <button type="button" class="icon-button" data-adjust="qa" data-delta="-1" aria-label="質疑応答を1分短くする">
                <span aria-hidden="true">−</span>
              </button>
              <input id="qaInput" type="number" min="1" max="60" step="1" inputmode="numeric" value="3" aria-label="質疑応答（分）" />
              <button type="button" class="icon-button" data-adjust="qa" data-delta="1" aria-label="質疑応答を1分長くする">
                <span aria-hidden="true">＋</span>
              </button>
            </div>
          </article>
        </div>

        <div class="setup-actions">
          <button id="startButton" type="button" class="primary-button">スタート</button>
          <button id="testBellButton" type="button" class="secondary-button">ベル確認</button>
        </div>
      </section>

      <section id="timerPanel" class="timer-panel" hidden>
        <div class="timer-topbar">
          <div>
            <p id="phaseEyebrow" class="phase-eyebrow">発表中</p>
            <h2 id="phaseTitle">発表時間</h2>
          </div>
          <div class="mini-summary" aria-label="設定時間">
            <span><b id="summaryPresentation">7</b>分 発表</span>
            <span><b id="summaryQa">3</b>分 質疑</span>
          </div>
        </div>

        <div class="time-stage" aria-label="残り時間">
          <div id="timeDisplay" class="time-display" role="timer">07:00</div>
          <p id="phaseMessage" class="phase-message">発表者と司会に見えるよう大きく表示しています。</p>
        </div>

        <div class="progress-wrap" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="timer-actions">
          <button id="pauseButton" type="button" class="secondary-button compact">一時停止</button>
          <button id="skipButton" type="button" class="secondary-button compact">質疑へ</button>
          <button id="resetDuringButton" type="button" class="ghost-button compact">リセット</button>
        </div>
      </section>

      <section id="completePanel" class="complete-panel" hidden>
        <p class="app-label">終了</p>
        <h2>発表と質疑応答が終了しました</h2>
        <div class="complete-time">00:00</div>
        <div class="complete-actions">
          <button id="nextSpeakerButton" type="button" class="primary-button">次の演者を開始</button>
          <button id="resetButton" type="button" class="secondary-button">リセット</button>
        </div>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
