<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7faf9" />
    <meta name="description" content="A free presentation and Q&A countdown timer optimized for smartphones and tablets." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Presentation Timer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Presentation &amp; Q&amp;A Countdown</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=15" />
  </head>
  <body>
    <button id="languageButton" type="button" class="language-button" aria-label="日本語に切り替える">日本語</button>
    <main class="app-shell" aria-live="polite">
      <section id="setupPanel" class="setup-panel">
        <div class="setup-copy">
          <p class="app-label" data-i18n="appLabel">Presentation &amp; Q&amp;A Timer</p>
          <h1 data-i18n="setupTitle">発表時間と質疑応答を設定</h1>
          <p data-i18n="setupDescription">開始後は残り時間を大きく表示します。</p>
        </div>

        <div class="duration-grid" aria-label="時間設定" data-i18n-aria="durationSettings">
          <article class="duration-card">
            <div>
              <span class="duration-label" data-i18n="presentationTime">発表時間</span>
              <strong><span id="presentationValue">7</span><span data-i18n="minuteSuffix">分</span> <span id="presentationSecondsValue">00</span><span data-i18n="secondSuffix">秒</span></strong>
            </div>
            <div class="presentation-controls">
              <div class="time-unit-control">
                <span data-i18n="minutesLabel">分</span>
                <div class="stepper" role="group" aria-label="発表時間の分を変更" data-i18n-aria="presentationMinuteStepper">
                  <button type="button" class="icon-button" data-adjust="presentation" data-delta="-1" aria-label="発表時間を1分短くする" data-i18n-aria="decreasePresentation">
                    <span aria-hidden="true">−</span>
                  </button>
                  <input id="presentationInput" type="number" min="0" max="60" step="1" inputmode="numeric" value="7" aria-label="発表時間（分）" data-i18n-aria="presentationMinutes" />
                  <button type="button" class="icon-button" data-adjust="presentation" data-delta="1" aria-label="発表時間を1分長くする" data-i18n-aria="increasePresentation">
                    <span aria-hidden="true">＋</span>
                  </button>
                </div>
              </div>
              <div class="time-unit-control">
                <span data-i18n="secondsLabel">秒</span>
                <div class="stepper" role="group" aria-label="発表時間の秒を変更" data-i18n-aria="presentationSecondStepper">
                  <button type="button" class="icon-button" data-adjust="presentationSeconds" data-delta="-1" aria-label="発表時間を1秒短くする" data-i18n-aria="decreasePresentationSecond">
                    <span aria-hidden="true">−</span>
                  </button>
                  <input id="presentationSecondsInput" type="number" min="0" max="59" step="1" inputmode="numeric" value="0" aria-label="発表時間（秒）" data-i18n-aria="presentationSeconds" />
                  <button type="button" class="icon-button" data-adjust="presentationSeconds" data-delta="1" aria-label="発表時間を1秒長くする" data-i18n-aria="increasePresentationSecond">
                    <span aria-hidden="true">＋</span>
                  </button>
                </div>
              </div>
            </div>
          </article>

          <article class="duration-card">
            <div>
              <span class="duration-label" data-i18n="qaTime">質疑応答</span>
              <strong><span id="qaValue">3</span><span data-i18n="minuteSuffix">分</span> <span id="qaSecondsValue">00</span><span data-i18n="secondSuffix">秒</span></strong>
            </div>
            <div class="presentation-controls">
              <div class="time-unit-control">
                <span data-i18n="minutesLabel">分</span>
                <div class="stepper" role="group" aria-label="質疑応答時間の分を変更" data-i18n-aria="qaMinuteStepper">
                  <button type="button" class="icon-button" data-adjust="qa" data-delta="-1" aria-label="質疑応答を1分短くする" data-i18n-aria="decreaseQa">
                    <span aria-hidden="true">−</span>
                  </button>
                  <input id="qaInput" type="number" min="0" max="60" step="1" inputmode="numeric" value="3" aria-label="質疑応答（分）" data-i18n-aria="qaMinutes" />
                  <button type="button" class="icon-button" data-adjust="qa" data-delta="1" aria-label="質疑応答を1分長くする" data-i18n-aria="increaseQa">
                    <span aria-hidden="true">＋</span>
                  </button>
                </div>
              </div>
              <div class="time-unit-control">
                <span data-i18n="secondsLabel">秒</span>
                <div class="stepper" role="group" aria-label="質疑応答時間の秒を変更" data-i18n-aria="qaSecondStepper">
                  <button type="button" class="icon-button" data-adjust="qaSeconds" data-delta="-1" aria-label="質疑応答を1秒短くする" data-i18n-aria="decreaseQaSecond">
                    <span aria-hidden="true">−</span>
                  </button>
                  <input id="qaSecondsInput" type="number" min="0" max="59" step="1" inputmode="numeric" value="0" aria-label="質疑応答（秒）" data-i18n-aria="qaSeconds" />
                  <button type="button" class="icon-button" data-adjust="qaSeconds" data-delta="1" aria-label="質疑応答を1秒長くする" data-i18n-aria="increaseQaSecond">
                    <span aria-hidden="true">＋</span>
                  </button>
                </div>
              </div>
            </div>
          </article>
        </div>

        <div class="sound-settings" aria-label="通知音設定" data-i18n-aria="soundSettings">
          <label class="sound-field">
            <span data-i18n="soundLabel">通知音</span>
            <select id="soundSelect">
              <option value="beep" data-i18n="soundBeep" selected>ビープ</option>
              <option value="bell" data-i18n="soundBell">ベル</option>
              <option value="chime" data-i18n="soundChime">チャイム</option>
            </select>
          </label>
          <label class="sound-toggle">
            <span data-i18n="soundModeLabel">通知</span>
            <span class="toggle-control">
              <input id="soundEnabledInput" type="checkbox" checked aria-label="通知音の有無" data-i18n-aria="soundEnabledAria" />
              <span id="soundEnabledLabel" data-i18n="soundOn">音あり</span>
            </span>
          </label>
        </div>

        <div class="setup-actions">
          <button id="startButton" type="button" class="primary-button" data-i18n="start">スタート</button>
          <button id="testBellButton" type="button" class="secondary-button" data-i18n="testBell">ベル確認</button>
        </div>
      </section>

      <section id="timerPanel" class="timer-panel" hidden>
        <div class="timer-topbar">
          <div>
            <p id="phaseEyebrow" class="phase-eyebrow">発表中</p>
            <h2 id="phaseTitle">発表時間</h2>
          </div>
          <div class="mini-summary" aria-label="設定時間" data-i18n-aria="configuredTimes">
            <span><b id="summaryPresentation">07:00</b><span data-i18n="presentationSummary"> 発表</span></span>
            <span><b id="summaryQa">03:00</b><span data-i18n="qaSummary"> 質疑</span></span>
          </div>
        </div>

        <div class="time-stage" aria-label="残り時間" data-i18n-aria="remainingTime">
          <div id="timeDisplay" class="time-display" role="timer">07:00</div>
          <p id="phaseMessage" class="phase-message">発表者と司会に見えるよう大きく表示しています。</p>
        </div>

        <div class="progress-wrap" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="timer-actions">
          <button id="pauseButton" type="button" class="secondary-button compact">一時停止</button>
          <button id="skipButton" type="button" class="secondary-button compact">質疑へ</button>
          <button id="resetDuringButton" type="button" class="ghost-button compact" data-i18n="reset">リセット</button>
        </div>
      </section>

      <section id="completePanel" class="complete-panel" hidden>
        <p class="app-label" data-i18n="finishedLabel">終了</p>
        <h2 data-i18n="finishedTitle">発表と質疑応答が終了しました</h2>
        <div class="complete-time">00:00</div>
        <div class="complete-actions">
          <button id="nextSpeakerButton" type="button" class="primary-button" data-i18n="nextSpeaker">次の演者を開始</button>
          <button id="resetButton" type="button" class="secondary-button" data-i18n="reset">リセット</button>
        </div>
      </section>
    </main>

    <script src="./app.js?v=15" defer></script>
  </body>
</html>
